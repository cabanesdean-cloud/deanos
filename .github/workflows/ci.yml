name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy deanos_engine tests
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Private denylist
        env:
          DENYLIST: ${{ secrets.DEANOS_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "DEANOS_DENYLIST secret not set; skipping"; exit 0; fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          if git ls-files -z | xargs -0 grep -EnHf "$RUNNER_TEMP/denylist.txt" --; then
            echo "Tracked files match the private denylist" >&2; exit 1
          fi
