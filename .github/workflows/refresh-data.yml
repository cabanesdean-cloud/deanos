name: Refresh market data

# Weeknights after the US close. Rebuilds the snapshot (prices, factors,
# precomputed regime fit) and publishes it as the `data-latest` release asset,
# which the engine downloads at cold start via DEANOS_DATA_URL.
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra data --extra dev
      - name: Build snapshot
        run: uv run python ../scripts/refresh_data.py --out "$RUNNER_TEMP/snapshot.npz"
      - name: Smoke-test the engine against the new snapshot
        env:
          DEANOS_DATA_PATH: ${{ runner.temp }}/snapshot.npz
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from deanos_engine.api import app
          from deanos_engine.demos import DEMOS, spec
          c = TestClient(app)
          for d in DEMOS:
              for section in ("overview", "risk", "regimes", "stress"):
                  r = c.get(f"/deanos/api/{section}", params={"p": spec(d)})
                  assert r.status_code == 200, (section, d["id"], r.text)
          print("smoke test passed")
          PY
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || \
            gh release create data-latest --title "Market data snapshot" \
              --notes "Rebuilt nightly by the Refresh market data workflow." --latest=false
          gh release upload data-latest "$RUNNER_TEMP/snapshot.npz" --clobber
      # Optional: running instances also re-check the release every 6 hours
      # (DEANOS_DATA_TTL_HOURS), so this only makes the switch immediate.
      - name: Redeploy so new instances load the new snapshot
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "redeploy triggered"; else echo "VERCEL_DEPLOY_HOOK not set; skipping"; fi
